name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Gamelistify.sln

      - name: Build
        run: dotnet build Gamelistify.sln -c Release --no-restore

      - name: Test
        run: dotnet test Gamelistify.sln -c Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            script: powershell -File build/build-release.ps1 -Version $VERSION -Rid win-x64
          - os: ubuntu-latest
            rid: linux-x64
            script: bash build/build-release.sh $VERSION linux-x64
          - os: macos-latest
            rid: osx-arm64
            script: bash build/build-release.sh $VERSION osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ${{ matrix.script }}

      - name: Verify native executable in package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/dist/Gamelistify-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No ZIP found in build/dist/"
            exit 1
          fi
          zip="${zips[0]}"
          echo "Verifying: $(basename "$zip")"
          case "${{ matrix.rid }}" in
            win-*) expected="Gamelistify.exe" ;;
            *)     expected="Gamelistify" ;;
          esac
          if unzip -Z1 "$zip" 2>/dev/null | grep -qxF "$expected"; then
            echo "OK '$expected' present"
          else
            echo "::error::Missing '$expected' in $(basename "$zip")"
            echo "ZIP contents:"
            unzip -Z1 "$zip"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: build/dist/Gamelistify-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/dist

      - name: Display structure
        run: ls -lh build/dist/

      - name: Generate checksums body
        run: |
          echo "" > release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          echo "## SHA256 Checksums" >> release-body.md
          echo "" >> release-body.md
          echo '```' >> release-body.md
          (cd build/dist && sha256sum *) >> release-body.md
          echo '```' >> release-body.md
          echo "" >> release-body.md
          echo "VirusTotal scan in progress — results appended automatically." >> release-body.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          body_path: release-body.md
          append_body: true
          fail_on_unmatched_files: false

      - name: VirusTotal Scan
        uses: cssnr/virustotal-action@v1
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: build/dist/*.zip
          sha256: true
          update_release: true
          release_id: ${{ steps.create_release.outputs.id }}
          release_heading: '### VirusTotal'
          collapsed: true
